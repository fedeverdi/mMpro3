name: Build and Deploy to Vercel Blob (Dev)

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    if: contains(github.event.head_commit.message, '--build') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install dependencies
        run: npm ci

      - name: Import Code Signing Certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "🔐 Importing code signing certificate..."
          
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          # Create and unlock keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Import certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k $KEYCHAIN_PATH -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          
          # Allow codesign to use the keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Add keychain to search list
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain
          
          # Verify certificate
          security find-identity -v -p codesigning $KEYCHAIN_PATH
          
          # Clean up
          rm certificate.p12
          
          echo "✅ Certificate imported successfully"

      - name: Build Rust audio engine
        run: |
          cd audio-engine
          cargo build --release
          cd ..

      - name: Build and sign app
        run: |
          chmod +x build-and-sign.sh
          ./build-and-sign.sh
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Create and sign DMG
        run: |
          chmod +x create-dmg.sh
          ./create-dmg.sh
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Create ZIP archive of app
        run: |
          cd out/mMpro3-darwin-arm64
          ditto -c -k --keepParent mMpro3.app mMpro3.app.zip
          cd ../..

      - name: Get version and create filename
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD=$(node -p "require('./package.json').buildNumber || 0")
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "filename=mMpro3-v${VERSION}-build${BUILD}-${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Upload ZIP to Vercel Blob
        run: |
          FILENAME="${{ steps.version.outputs.filename }}-arm64.zip"
          curl -X PUT "https://blob.vercel-storage.com/$FILENAME" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_BLOB_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @out/mMpro3-darwin-arm64/mMpro3.app.zip \
            -o upload-response-zip.json
          cat upload-response-zip.json
          echo "ZIP uploaded: https://blob.vercel-storage.com/$FILENAME"

      - name: Upload DMG to Vercel Blob
        run: |
          FILENAME="${{ steps.version.outputs.filename }}-arm64.dmg"
          curl -X PUT "https://blob.vercel-storage.com/$FILENAME" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_BLOB_TOKEN }}" \
            -H "Content-Type: application/x-apple-diskimage" \
            --data-binary @out/mMpro3-darwin-arm64/mMpro3.dmg \
            -o upload-response-dmg.json
          cat upload-response-dmg.json
          echo "DMG uploaded: https://blob.vercel-storage.com/$FILENAME"

      - name: Create release notes
        run: |
          echo "## Build Info" > release-notes.md
          echo "- Version: ${{ steps.version.outputs.version }}" >> release-notes.md
          echo "- Build: ${{ steps.version.outputs.build }}" >> release-notes.md
          echo "- Timestamp: ${{ steps.version.outputs.timestamp }}" >> release-notes.md
          echo "- Branch: dev" >> release-notes.md
          echo "" >> release-notes.md
          echo "## Downloads" >> release-notes.md
          echo "- ZIP: https://blob.vercel-storage.com/${{ steps.version.outputs.filename }}-arm64.zip" >> release-notes.md
          echo "- DMG: https://blob.vercel-storage.com/${{ steps.version.outputs.filename }}-arm64.dmg" >> release-notes.md
          cat release-notes.md
  build-windows:
    runs-on: windows-latest
    if: contains(github.event.head_commit.message, '--build') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Build Rust audio engine (with ASIO)
        run: |
          cd audio-engine
          cargo build --release
          cd ..

      - name: Build Electron app and create installer
        run: npm run make

      - name: Get version and create filename
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD=$(node -p "require('./package.json').buildNumber || 0")
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "filename=mMpro3-v${VERSION}-build${BUILD}-${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: List generated files
        shell: bash
        run: |
          echo "Contents of out/make:"
          ls -la out/make/
          echo ""
          echo "Contents of out/make/squirrel.windows:"
          ls -la out/make/squirrel.windows/
          echo ""
          echo "Contents of out/make/squirrel.windows/x64:"
          ls -la out/make/squirrel.windows/x64/

      - name: Upload Windows Setup to Vercel Blob
        shell: bash
        run: |
          FILENAME="${{ steps.version.outputs.filename }}-Setup.exe"
          SETUP_PATH=$(find out/make/squirrel.windows/x64 -name "*Setup.exe" | head -n 1)
          echo "Found Setup.exe at: $SETUP_PATH"
          curl -X PUT "https://blob.vercel-storage.com/$FILENAME" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_BLOB_TOKEN }}" \
            -H "Content-Type: application/x-msdownload" \
            --data-binary @"$SETUP_PATH" \
            -o upload-response-win.json
          cat upload-response-win.json
          echo "Windows Setup uploaded: https://blob.vercel-storage.com/$FILENAME"